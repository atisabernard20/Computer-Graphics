<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Troll Platformer – Camera Demo</title>
<style>
:root{--bg:#10131c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c}}
:root[data-theme="dark"]{--bg:#10131c}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style></head><body><canvas id="c"></canvas>
<script>
// ===== World: tile grid, world units = pixels, T = tile size =====
const T=32,COLS=80,ROWS=15;
let grid,traps,door;
const rect=(c,r,w,h,v=1)=>{for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)grid[y][x]=v};
function resetWorld(){
  grid=Array.from({length:ROWS},()=>new Uint8Array(COLS));
  rect(0,13,COLS,2); rect(0,0,1,ROWS); rect(COLS-1,0,1,ROWS);
  rect(20,13,3,2,0); rect(45,13,4,2,0);                       // pits
  rect(10,10,4,1); rect(26,9,5,1); rect(32,7,4,1); rect(52,10,5,1); rect(60,8,4,1);
  grid[10][21]=2;                                              // 2 = invisible block
  traps=[{t:'fall',c:14,state:0,timer:0},{t:'spike',c:30,r:12,out:0},{t:'spike',c:63,r:12,out:0}];
  door={x:70*T,lim:77*T,w:28,h:56};
}
// ===== Camera: our own world->screen transform =====
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
class Cam{
  constructor(vp,z){Object.assign(this,{vp,z,x:0,y:0,tx:0,ty:0,k:8,dzx:50,dzy:30})}
  w2s(x,y){return [(x-this.x)*this.z+this.vp.x+this.vp.w/2,(y-this.y)*this.z+this.vp.y+this.vp.h/2]}
  s2w(sx,sy){return [(sx-this.vp.x-this.vp.w/2)/this.z+this.x,(sy-this.vp.y-this.vp.h/2)/this.z+this.y]}
  follow(p,dt){
    const px=p.x+p.w/2,py=p.y+p.h/2,dx=px-this.x,dy=py-this.y;
    if(dx>this.dzx)this.tx=px-this.dzx; else if(dx<-this.dzx)this.tx=px+this.dzx;   // dead-zone
    if(dy>this.dzy)this.ty=py-this.dzy; else if(dy<-this.dzy)this.ty=py+this.dzy;
    const a=1-Math.exp(-this.k*dt);                                                  // smoothing
    this.x+=(this.tx-this.x)*a; this.y+=(this.ty-this.y)*a;
    const hw=this.vp.w/2/this.z,hh=this.vp.h/2/this.z;
    this.x=clamp(this.x,hw,COLS*T-hw); this.y=clamp(this.y,hh,ROWS*T-hh);
  }
}
// ===== Players =====
const mk=(x,col,k)=>({x,y:13*T-29,w:20,h:28,vx:0,vy:0,g:0,lg:0,jh:0,col,k,deaths:0,done:0,sx:x});
let players,cams,mini,time,started,winner;
function hit(p){
  let h=false;
  for(let r=Math.floor(p.y/T);r<=Math.floor((p.y+p.h-.01)/T);r++)
    for(let c=Math.floor(p.x/T);c<=Math.floor((p.x+p.w-.01)/T);c++){
      if(c<0||c>=COLS){h=true;continue} if(r<0||r>=ROWS)continue;
      const v=grid[r][c]; if(v){h=true; if(v==2){grid[r][c]=1;beep(200)}}
    }
  return h;
}
function step(p,dt){
  const K=p.k,ax=(keys[K.r]?1:0)-(keys[K.l]?1:0);
  p.vx=ax*220; p.vy=Math.min(900,p.vy+1800*dt);
  if(p.g)p.lg=.1; else p.lg-=dt;                                  // coyote time
  if(keys[K.j]&&p.lg>0&&!p.jh){p.vy=-560;p.lg=0;p.jh=1;beep(420)}
  if(!keys[K.j]){if(p.jh&&p.vy<0)p.vy*=.5;p.jh=0}                 // variable jump height
  p.x+=p.vx*dt;
  if(hit(p)){p.x=p.vx>0?Math.floor((p.x+p.w)/T)*T-p.w-.001:(Math.floor(p.x/T)+1)*T;p.vx=0}
  p.y+=p.vy*dt; p.g=0;
  if(hit(p)){if(p.vy>0){p.y=Math.floor((p.y+p.h)/T)*T-p.h-.001;p.g=1}else p.y=(Math.floor(p.y/T)+1)*T;p.vy=0}
  if(p.y>ROWS*T+64)die(p);
}
function die(p){p.deaths++;p.x=p.sx;p.y=13*T-29;p.vx=p.vy=0;beep(120,.25);resetWorld()}
function updateTraps(dt){
  let near=false;
  for(const p of players){
    const cx=p.x+p.w/2;
    for(const t of traps){
      if(t.t=='fall'&&!t.state&&Math.abs(cx-(t.c+1)*T)<T*2.2)t.state=1;
      if(t.t=='spike'){
        if(Math.abs(cx-(t.c+.5)*T)<T*1.5)t.out=1;
        if(t.out&&p.x+p.w>t.c*T+4&&p.x<(t.c+1)*T-4&&p.y+p.h>t.r*T+T*.4&&p.y<(t.r+1)*T){die(p);return}
      }
    }
    if(Math.abs(cx-door.x)<160&&door.x<door.lim)near=true;
    if(!p.done&&p.x+p.w>door.x&&p.x<door.x+door.w&&p.y+p.h>13*T-door.h){p.done=time;if(!winner)winner=p}
  }
  if(near)door.x+=300*dt;                                          // runaway door
  for(const t of traps)if(t.t=='fall'&&t.state==1){t.timer+=dt;if(t.timer>.3){rect(t.c,13,2,2,0);t.state=2;beep(90,.2)}}
}
// ===== Rendering with culling =====
let ctx,W,H,debug=true,stats=[0,0];
function drawView(cam,focus,isMini){
  const {vp,z}=cam;
  ctx.save();ctx.beginPath();ctx.rect(vp.x,vp.y,vp.w,vp.h);ctx.clip();
  ctx.fillStyle=isMini?'rgba(0,0,0,.65)':'#1b2233';ctx.fillRect(vp.x,vp.y,vp.w,vp.h);
  if(!isMini)for(const [f,col,h] of [[.15,'#232c45',140],[.35,'#2c3858',90]]){      // parallax
    ctx.fillStyle=col;const w=260,off=-(cam.x*f*z)%w;
    for(let x=vp.x+off-w;x<vp.x+vp.w+w;x+=w){ctx.beginPath();ctx.moveTo(x,vp.y+vp.h);ctx.lineTo(x+w/2,vp.y+vp.h-h);ctx.lineTo(x+w,vp.y+vp.h);ctx.fill()}
  }
  const hw=vp.w/2/z,hh=vp.h/2/z;                                                  // culling: view rect -> tile range
  const c0=Math.max(0,Math.floor((cam.x-hw)/T)),c1=Math.min(COLS-1,Math.floor((cam.x+hw)/T));
  const r0=Math.max(0,Math.floor((cam.y-hh)/T)),r1=Math.min(ROWS-1,Math.floor((cam.y+hh)/T));
  let n=0;ctx.fillStyle='#8a93ad';
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    n++; if(grid[r][c]==1){const [sx,sy]=cam.w2s(c*T,r*T);ctx.fillRect(sx,sy,Math.ceil(T*z),Math.ceil(T*z))}
  }
  if(!isMini)stats[focus.id]=n;
  for(const t of traps)if(t.t=='spike'&&t.out){                                   // spikes
    const [sx,sy]=cam.w2s(t.c*T,(t.r+1)*T);ctx.fillStyle='#ff5a5a';ctx.beginPath();
    ctx.moveTo(sx,sy);ctx.lineTo(sx+T*z/2,sy-T*z*.7);ctx.lineTo(sx+T*z,sy);ctx.fill();
  }
  {const [sx,sy]=cam.w2s(door.x,13*T-door.h);ctx.fillStyle='#ffd24a';ctx.fillRect(sx,sy,door.w*z,door.h*z)}
  for(const p of players){
    const [sx,sy]=cam.w2s(p.x,p.y);ctx.fillStyle=p.col;
    if(isMini)ctx.fillRect(sx-2,sy-2,5,5);else ctx.fillRect(sx,sy,p.w*z,p.h*z);
  }
  if(isMini){
    ctx.strokeStyle='#fff';ctx.lineWidth=1;                                        // each camera's window on the minimap
    for(const c of cams){const [a,b]=cam.w2s(c.x-c.vp.w/2/c.z,c.y-c.vp.h/2/c.z);ctx.strokeRect(a,b,c.vp.w/c.z*z,c.vp.h/c.z*z)}
  }else{
    if(debug){                                                                     // dead-zone + target
      const [mx,my]=cam.w2s(cam.x,cam.y);ctx.strokeStyle='#4dff9e';ctx.lineWidth=1;
      ctx.strokeRect(mx-cam.dzx*z,my-cam.dzy*z,cam.dzx*2*z,cam.dzy*2*z);
      const [tx,ty]=cam.w2s(cam.tx,cam.ty);ctx.fillStyle='#4dff9e';ctx.fillRect(tx-3,ty-3,6,6);
      ctx.font='12px monospace';
      ctx.fillText(`screen=(world-c)*z+vpCentre  c=(${cam.x|0},${cam.y|0}) z=${z.toFixed(2)}`,vp.x+10,vp.y+vp.h-34);
      ctx.fillText(`window=${(vp.w/z)|0}x${(vp.h/z)|0}  tiles drawn ${n} / total ${COLS*ROWS}`,vp.x+10,vp.y+vp.h-18);
    }
    ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';
    ctx.fillText(`${focus.name}   deaths: ${focus.deaths}   ${focus.done?'FINISHED '+focus.done.toFixed(1)+'s':time.toFixed(1)+'s'}`,vp.x+12,vp.y+24);
  }
  ctx.restore();
}
function layout(){
  const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  const z=cams?cams[0].z:1.5,old=cams;
  cams=[new Cam({x:0,y:0,w:W/2-1,h:H},z),new Cam({x:W/2+1,y:0,w:W/2-1,h:H},z)];
  if(old)cams.forEach((c,i)=>{c.x=c.tx=old[i].x;c.y=c.ty=old[i].y});
  const mw=Math.min(300,W/2-20);mini=new Cam({x:W/2-mw/2,y:8,w:mw,h:mw*ROWS/COLS},mw/(COLS*T));
  mini.x=COLS*T/2;mini.y=ROWS*T/2;
}
// ===== Input, sound, main loop =====
const keys={};
addEventListener('keydown',e=>{keys[e.code]=1;started=1;
  if(e.code=='KeyG')debug=!debug;
  if(e.code=='KeyR')init();
  if(e.code=='Equal')cams.forEach(c=>c.z=Math.min(3,c.z+.1));
  if(e.code=='Minus')cams.forEach(c=>c.z=Math.max(.6,c.z-.1));
  if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
let ac;function beep(f,d=.08){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=f;o.type='square';g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const cv=document.getElementById('c');ctx=cv.getContext('2d');
function init(){
  resetWorld();time=0;started=0;winner=null;
  players=[mk(3*T,'#4fc3f7',{l:'KeyA',r:'KeyD',j:'KeyW'}),mk(4*T,'#ff8a65',{l:'ArrowLeft',r:'ArrowRight',j:'ArrowUp'})];
  players.forEach((p,i)=>{p.id=i;p.name='P'+(i+1)});
  if(cams)cams.forEach((c,i)=>{c.x=c.tx=players[i].x;c.y=c.ty=players[i].y});
}
layout();init();
cams.forEach((c,i)=>{c.x=c.tx=players[i].x;c.y=c.ty=players[i].y});
addEventListener('resize',layout);
let last=performance.now();
(function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(started&&!winner)time+=dt;
  if(!winner){players.forEach(p=>step(p,dt));updateTraps(dt)}
  cams.forEach((c,i)=>c.follow(players[i],dt));
  ctx.clearRect(0,0,W,H);
  cams.forEach((c,i)=>drawView(c,players[i],false));
  drawView(mini,null,true);
  ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';
  ctx.fillText('P1: A/D + W   P2: arrows   G debug   +/- zoom   R restart',W/2,H-8);
  if(winner){ctx.font='bold 36px system-ui';ctx.fillText(winner.name+' wins! (R to restart)',W/2,H/2)}
  ctx.textAlign='left';requestAnimationFrame(loop);
})(last);
</script></body></html>
